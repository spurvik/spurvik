name: Spurvik EU AI Act Unwrapped Call Scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  spurvik-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan for unwrapped AI model & agent calls (spurvik-mcp-server@1.0.4)
        run: node examples/github-actions-ci-check/run-mcp-scan.mjs --root . --dir src
