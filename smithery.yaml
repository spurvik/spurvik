# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml
# Repository: https://github.com/spurvik/spurvik (MIT)
# Packages: spurvik@1.0.3, spurvik-sdk@1.0.3, spurvik-mcp-server@1.0.2
# Docs: https://spurvik.com/docs
# Interactive Sandbox: https://console.spurvik.com/sandbox?scan=https://your-app.com
# Remote Streamable HTTP MCP: https://console.spurvik.com/api/mcp (protocolVersion: "2025-06-18")

startCommand:
  type: stdio
  configSchema:
    type: object
    required: []
    properties:
      workspaceRoot:
        type: string
        description: "Workspace directory path for static unwrapped-call scans (defaults to current working directory)."
        default: "."
      spurvikApiKey:
        type: string
        description: "Optional Spurvik API key (spurvik_live_...) for project-linked EU (fra1) control-plane calls. Not required for the 4 read-only tools."
      spurvikHmacSecret:
        type: string
        description: "Optional server-side HMAC-SHA256 secret (>= 16 characters) for local receipt signature inspection."
  commandFunction:
    |-
    (config) => ({
      command: "node",
      args: [
        "packages/mcp/dist/index.js",
        "--root",
        config.workspaceRoot || "."
      ],
      env: {
        ...(config.workspaceRoot ? { SPURVIK_MCP_ROOT: config.workspaceRoot } : {}),
        ...(config.spurvikApiKey ? { SPURVIK_API_KEY: config.spurvikApiKey } : {}),
        ...(config.spurvikHmacSecret ? { SPURVIK_HMAC_SECRET: config.spurvikHmacSecret } : {})
      }
    })
