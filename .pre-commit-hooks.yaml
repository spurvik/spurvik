# Official `pre-commit` hook manifest for Spurvik (https://spurvik.com)
# Usage in `.pre-commit-config.yaml`:
#   repos:
#     - repo: https://github.com/spurvik/spurvik
#       rev: v1
#       hooks:
#         - id: spurvik-audit
#         - id: spurvik-gate-test

- id: spurvik-audit
  name: Spurvik EU AI Act Unwrapped AI Call Audit (0 network calls, file:line only)
  description: Blocks commits introducing unwrapped OpenAI, Anthropic, Gemini, Mistral, Vercel AI SDK, LangChain, or PydanticAI model calls (Art. 12 & GDPR Art. 5(1)(c)).
  entry: npx --yes spurvik@1.0.18 audit . --fail-on-gap
  language: system
  pass_filenames: false
  always_run: true
  stages: [pre-commit, pre-push]

- id: spurvik-gate-test
  name: Spurvik EU AI Act Art. 14 Cryptographic Blocking Check (6 vectors, 0 network calls)
  description: Verifies all 6 deterministic Art. 14 human-oversight adversarial & approval vectors offline (`spurvik/channels` HMAC-SHA256).
  entry: npx --yes spurvik@1.0.18 gate
  language: system
  pass_filenames: false
  always_run: true
  stages: [pre-commit, pre-push]

- id: spurvik-c2pa-check
  name: Spurvik EU AI Act Art. 50(2) C2PA Provenance Check (2 Dec 2026)
  description: Manual / pre-release check of a live HTTPS image or domain hero image for an intact C2PA JUMBF manifest (`args: ["https://yourdomain.eu/hero.webp", "--fail-on-missing"]`).
  entry: npx --yes spurvik@1.0.18 c2pa
  language: system
  pass_filenames: false
  always_run: true
  stages: [manual]
